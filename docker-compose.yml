# PaySure — UPI Payment Reliability Lab (sandbox)
# Usage:  cp .env.example .env   &&   docker compose up --build
name: paysure

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paysure}
      POSTGRES_USER: ${POSTGRES_USER:-paysure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Used from Phase 4 (rate limiting, status cache). Started now so the stack shape is stable.
  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Used from Phase 4 (outbox publisher -> Kafka). Single-node KRaft broker for local dev.
  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build: ./backend
    # PostgreSQL is required. Redis and Kafka are started first so topics exist (Kafka auto-creation is off) and the
    # status cache / rate limiter are warm; the app still runs and degrades safely if either goes away later.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      # Local webhook demo: the built-in sandbox receiver, reachable only at exactly this host:port (SSRF allow-list).
      PAYSURE_WEBHOOK_SANDBOX_RECEIVER: ${PAYSURE_WEBHOOK_SANDBOX_RECEIVER:-true}
      PAYSURE_WEBHOOK_LOCAL_ALLOWLIST: ${PAYSURE_WEBHOOK_LOCAL_ALLOWLIST:-localhost:8080}
      PAYSURE_WEBHOOK_SECRET_KEY: ${PAYSURE_WEBHOOK_SECRET_KEY:-}
      # The frontend nginx sets X-Forwarded-For from the real client address. Only trust it if clients reach the backend
      # exclusively through that proxy (do not publish the backend port outside a demo).
      PAYSURE_RATE_LIMIT_TRUST_XFF: ${PAYSURE_RATE_LIMIT_TRUST_XFF:-true}
      # Per-IP limit on login/register (requests per minute). CI raises it because one runner IP drives the whole E2E suite.
      PAYSURE_RATE_LIMIT_AUTH_PER_IP_LIMIT: ${PAYSURE_RATE_LIMIT_AUTH_PER_IP_LIMIT:-20}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-paysure}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paysure}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PAYSURE_JWT_SECRET: ${PAYSURE_JWT_SECRET:?set PAYSURE_JWT_SECRET in .env}
      PAYSURE_JWT_TTL_MINUTES: ${PAYSURE_JWT_TTL_MINUTES:-60}
      PAYSURE_CORS_ORIGINS: ${PAYSURE_CORS_ORIGINS:-http://localhost:3000}
      PAYSURE_SEED_ENABLED: ${PAYSURE_SEED_ENABLED:-true}
      PAYSURE_DEMO_PASSWORD: ${PAYSURE_DEMO_PASSWORD:-}
      PAYSURE_DEV_TOOLS_ENABLED: ${PAYSURE_DEV_TOOLS_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Metrics: Prometheus scrapes the backend; Grafana shows the provisioned "PaySure" dashboard (http://localhost:3001).
  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
  promdata:
  grafanadata:
